<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} — {% endif %}GerenTAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  {% if current_user.is_authenticated %}
  <nav class="navbar">
    <div class="navbar-brand">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
        <rect x="9" y="3" width="6" height="4" rx="1" />
        <path d="M9 12l2 2 4-4" />
      </svg>
      <span>GerenTAR</span>
    </div>
    <div class="navbar-links">
      <a class="nav-link {{ 'active' if request.endpoint == 'index' }}" href="{{ url_for('index') }}">Home</a>
      <button class="btn-logout" onclick="window.location.href='{{ url_for('logout') }}'">Sair</button>
    </div>
  </nav>
  {% endif %}

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="alerts">
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category in ['warning', 'success'] else 'warning' }}">
      <span>{{ message }}</span>
      <button class="alert-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</body>
</html>
