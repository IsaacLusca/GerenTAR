{% extends "base.html" %}

{% block content %}
    <h1>Olá, {{ current_user.username }}</h1>
    <p>Bem-vindo ao GerenTar, o sistema de gerenciamento de tarefas!</p>
    {% for post in posts %}
        <div>
            <p>{{ post.autor.username }} disse: <b>{{ post.body }}</b></p>
        </div>
    {% endfor %}
    
{% endblock %}
